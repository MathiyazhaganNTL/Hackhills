version: "3.9"

services:
  bayora-db:
    image: postgres:16-alpine
    container_name: bayora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bayora_user
      POSTGRES_PASSWORD: bayora_secure_password_replace_in_prod
      POSTGRES_DB: bayora_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bayora_user -d bayora_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  bayora-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: bayora-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://bayora_user:bayora_secure_password_replace_in_prod@bayora-db:5432/bayora_db
      JWT_SECRET: bayora-super-secret-jwt-key-32-bytes-minimum-security
      ENFORCE_CONTAINER_ISOLATION: "false"
      ALLOWED_ORIGINS: '["http://localhost:5173", "http://localhost:3000", "http://127.0.0.1:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      bayora-db:
        condition: service_healthy

  bayora-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: bayora-ui
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - bayora-backend

  prometheus:
    image: prom/prometheus:latest
    container_name: bayora-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  postgres_data:
